# Dependabot — keeps the full-SHA-pinned GitHub Actions fresh (PMSERV-074, ADR-013).
#
# Actions in ci.yml / release.yml are pinned to full commit SHAs with a
# `# vX.Y.Z` comment. Dependabot recognises that convention and bumps BOTH the
# SHA and the comment in a single PR.
#
# NOTE (trade-off, see ADR-013): the `github-actions` group below bundles every
# action update — including breaking major bumps — into ONE PR. A weekly PR may
# therefore mix a safe patch with a Node-runtime major bump; review accordingly
# (you cannot merge the safe bumps without also taking the major).
#
# ASSUMPTION: checkout v6+/setup-python v6+/upload-artifact v7+/download-artifact
# v8+ require Actions Runner >= v2.327.1. GitHub-hosted `ubuntu-latest` always
# satisfies this. If this repo ever moves to self-hosted runners, re-verify the
# runner version before accepting a Dependabot major bump.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # PMSERV-178: keep requirements.lock fresh.
  #
  # INTENT was: requirements.lock is the hash-verified tree that ci.yml's
  # `test-locked` job installs with `--require-hashes`, and a lock nobody
  # updates is how it ended up two minor versions behind reality (pinned
  # fastmcp 3.2.4 while everyone ran 3.4.5). Being pip-compile output, it
  # looked like a natural fit for the `pip` ecosystem.
  #
  # MEASURED REALITY (PMSERV-185): this entry does not do that, and never has.
  # Not one Dependabot PR in this repo's history has touched
  # requirements.lock, and the single `pip`-ecosystem PR it has ever opened
  # changed pyproject.toml and nothing else. The ecosystem's manifest matching
  # covers `requirements*.txt`, pyproject.toml, Pipfile and setup.py — a file
  # named `requirements.lock` is not a manifest to it.
  #
  # The entry EARNS ITS KEEP anyway: watching pyproject.toml's declared ranges
  # is what surfaced the fastmcp v4 major. Just do not read it as the mechanism
  # that keeps the hash-verified lock fresh — that is manual, and PMSERV-186
  # tracks giving it a real guard.
  #
  # Grouped like github-actions above, and with the same trade-off (ADR-013):
  # one PR may mix a safe patch with a breaking major. Review accordingly.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # PMSERV-178: keep uv.lock fresh — best effort, by design.
  #
  # uv.lock is the DEVELOPMENT environment (.devcontainer, and the
  # `uv run --project` flow in plugin/README.md). Astral documents this
  # ecosystem, but calls the support incomplete and tracks unsupported cases
  # upstream; there are open reports of uv.lock simply not being updated.
  #
  # That is acceptable ONLY because nothing depends on it working: ci.yml's
  # `lockfile-freshness` job runs `uv lock --check` and fails if uv.lock drifts
  # from pyproject.toml. If this entry silently does nothing, CI still tells
  # us. Never move the hash-verified file onto this ecosystem without
  # revisiting that reasoning.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      uv-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
