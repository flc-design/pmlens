name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/lockfiles.py

      - name: Format check with ruff
        run: ruff format --check src/ tests/ scripts/lockfiles.py

      - name: Run tests with coverage
        run: pytest --cov

  test-locked:
    # Runtime and dev dependencies are installed with hashes from uv.lock's
    # checked export. The editable build backend (hatchling) is fetched by
    # pip build isolation and is outside this hash guarantee (ADR-052).
    # The floating matrix above still tests what fresh user installs resolve.
    needs: lockfile-freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies (hash-verified)
        # Universal export retains platform and Python markers, including
        # Linux-only dependencies. Do not regenerate via platform-local pip-compile.
        run: pip install --require-hashes -r requirements.lock

      - name: Install the project itself
        run: pip install -e . --no-deps

      - name: Check installed dependency constraints
        # --no-deps must not hide a pyproject range that excludes a locked pin.
        run: pip check

      - name: Run tests against the locked tree
        run: pytest -q

  lockfile-freshness:
    # PMSERV-186: uv.lock owns the resolution; requirements.lock is its
    # hash-bearing export for pip. This fails on project/lock/export drift,
    # independently of Dependabot. It runs offline and never upgrades pins.
    # Upstream freshness is an explicit `make lock-refresh` operation; it is
    # not a requirement that changes whenever a new package is published.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        # Keep aligned with scripts/lockfiles.py and .devcontainer/Dockerfile.
        run: pip install uv==0.11.25

      - name: Both lockfiles must match the project and each other
        run: python scripts/lockfiles.py check

  identity-guard:
    # PMSERV-137 / ADR-034 step 6: an INDEPENDENT mechanical gate for the
    # pm-server -> pmlens identity flip. Kept SEPARATE from the pytest guards —
    # a guard living in the same commit/file as the value it asserts cannot
    # protect that commit — so the rename can never silently regress.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Phase-3 identity grep gate
        run: |
          set -euo pipefail
          # 1. The legacy FastMCP server name must be gone everywhere in src/.
          if grep -rnF 'FastMCP("pm-server"' src/; then
            echo "::error::legacy FastMCP(\"pm-server\") still present — identity flip incomplete"
            exit 1
          fi
          # 2. The new identity must be present; allow optional arguments.
          grep -qF 'FastMCP("pmlens"' src/pmlens/server.py
          # 3. The CLAUDE.md/AGENTS.md marker slug must STAY 'pm-server:begin'
          #    (ADR-032 invariant: renaming it strands existing user blocks).
          count="$(grep -c 'pm-server:begin' src/pmlens/rules.py)"
          test "$count" -ge 3
          echo "identity gate OK: FastMCP(\"pmlens\") present, no legacy name, marker slug intact (${count} lines)"
