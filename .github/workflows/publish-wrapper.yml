name: Release wrapper (pm-server) to PyPI

# The `pm-server` distribution is a thin compatibility wrapper that depends on
# `pmlens` (the real package, published by release.yml). Since the Phase-2 rename
# the repo ROOT is `pmlens`, so release.yml only publishes pmlens — the wrapper
# lost its automated publish path. This workflow restores it via OIDC Trusted
# Publishing, so no local PyPI API token is ever needed (matches the .pypirc
# hygiene decision of 2026-05-19). PMSERV-137 Phase-3 / step 7.
#
# RECOVERY PATH ONLY since PMSERV-174 (ADR-050 Phase 3).
#
# The normal release publishes this wrapper from release.yml, in the same job
# as pmlens and behind the same single approval. The `v*` trigger was removed
# here so a tag no longer starts a second run needing a second approval — that
# was the half-release hole PMSERV-173 made loud and PMSERV-174 closed.
#
# This file is deliberately NOT deleted. It is the rollback: if the merged
# publish in release.yml fails for OIDC reasons, restore the `push: tags: 'v*'`
# trigger here and the old two-approval path works again, because the
# `publish-wrapper.yml` trusted publisher entry on pypi.org is kept until a
# real release has shipped through the merged workflow (docs/RELEASING.md §6,
# steps 4–5). It also remains the manual backfill for a wrapper-only republish.
#
# Triggers:
#   - workflow_dispatch → manual recovery / backfill. Run it from `main` (where
#     this file lives); it builds the wrapper at the version committed on that
#     ref, so no ref input is needed (and untrusted input in checkout `ref:` is
#     avoided). Note the caveat in docs/RELEASING.md: the `pypi` environment may
#     restrict deployments to `v*` tags, in which case the dispatch path is
#     unusable and the fallback is a `vX.Y.Z-wrapper.N` tag.
#
# PyPI setup (one-time, done by a maintainer on pypi.org):
#   pm-server project → Settings → Publishing → two GitHub trusted publishers:
#     Owner=flc-design  Repository=pmlens  Environment=pypi
#     Workflow=release.yml           ← the live path since PMSERV-174
#     Workflow=publish-wrapper.yml   ← kept as the rollback; remove only after
#                                      a real release ships via release.yml

on:
  workflow_dispatch:

permissions:
  contents: read

# See release.yml: never cancel a run that may already have uploaded to PyPI.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wrapper distributions
    runs-on: ubuntu-latest
    outputs:
      # Read from the wrapper's own pyproject rather than the tag, so the
      # ordering gate in `publish` also works on a workflow_dispatch backfill,
      # where ref_name is a branch and carries no version.
      version: ${{ steps.wrapper_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # The v0.12.1 incident in reverse: there, the wrapper was STALE relative
      # to the tag and PyPI rejected it loudly. `skip-existing: true` below now
      # swallows that rejection, so an unbumped wrapper would republish nothing
      # and still go green. Assert the pairing instead. Skipped on
      # workflow_dispatch, where ref_name is a branch, not a version.
      - name: Tag name must match the wrapper's version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"; expected="${expected%%-*}"
          actual="$(python -c 'import tomllib;print(tomllib.load(open("packaging/pm-server-wrapper/pyproject.toml","rb"))["project"]["version"])')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $TAG expects wrapper version $expected but the tagged tree has $actual"
            exit 1
          fi
          echo "tag $TAG matches wrapper $actual"

      - name: Read the wrapper version
        id: wrapper_version
        run: |
          set -euo pipefail
          v="$(python -c 'import tomllib;print(tomllib.load(open("packaging/pm-server-wrapper/pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wrapper version: $v"

      - name: Build wrapper sdist + wheel
        run: python -m build packaging/pm-server-wrapper --outdir wrapper-dist

      - name: Validate distributions
        run: |
          ls -la wrapper-dist/
          test -n "$(ls wrapper-dist/*.whl 2>/dev/null)"
          test -n "$(ls wrapper-dist/*.tar.gz 2>/dev/null)"
          twine check wrapper-dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wrapper-dist
          path: wrapper-dist/
          if-no-files-found: error

  publish:
    # Standalone since PMSERV-174: the normal path publishes this wrapper from
    # release.yml under a single approval. Reaching this job means someone is
    # deliberately running the recovery/backfill path, so the pmlens presence
    # gate below is doing real work again — nothing else orders the two uploads
    # here.
    name: Publish pm-server wrapper to PyPI (recovery / backfill)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pm-server/
    permissions:
      id-token: write       # OIDC required for PyPI Trusted Publisher
      attestations: write   # PEP 740 provenance attestation
    steps:
      # The inverse half of the gate in release.yml, and the one that closes a
      # PERMANENT window rather than a recoverable one. This wrapper declares
      # `pmlens>=X.Y.Z`; publishing it before pmlens X.Y.Z exists leaves
      # `uvx pm-server@X.Y.Z` unresolvable, and if the pmlens run's `verify`
      # then fails, the release can never be completed at that version — PyPI
      # does not allow re-uploading a filename. So: pmlens first, always.
      - name: Require pmlens on PyPI before publishing the wrapper
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            echo "::error::the build job did not export a wrapper version; refusing to publish blind"
            exit 1
          fi
          url="https://pypi.org/pypi/pmlens/${VERSION}/json"
          # Same schedule and the same two curl subtleties as release.yml.
          attempts=10
          for attempt in $(seq 1 "$attempts"); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      --max-time 20 --retry 2 --retry-max-time 40 --retry-connrefused \
                      -H 'Accept: application/json' "$url")" || code=000
            if [ "$code" = "200" ]; then
              echo "pmlens ${VERSION} is on PyPI (poll ${attempt})"
              exit 0
            fi
            echo "poll ${attempt}/${attempts}: HTTP ${code} for ${url}"
            [ "$attempt" -lt "$attempts" ] && sleep $((attempt * 15))
          done
          echo "::error::pmlens ${VERSION} is not on PyPI after 10 polls (~11 minutes). Publish pmlens ${VERSION} FIRST — normally by tagging v${VERSION}, which runs release.yml and publishes both — then re-run this job only if the wrapper is still missing. Publishing this wrapper now would ship a metapackage whose pmlens>=${VERSION} floor cannot resolve, permanently: PyPI never allows re-uploading a filename. See docs/RELEASING.md §2 and §6."
          exit 1

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wrapper-dist
          path: wrapper-dist/

      - name: Publish wrapper to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: wrapper-dist/
          # Idempotent republish (see release.yml) — the pypi environment
          # only deploys from v* tags, so wrapper-only fixes re-fire BOTH
          # workflows via a new tag; the pmlens side then no-ops.
          skip-existing: true
