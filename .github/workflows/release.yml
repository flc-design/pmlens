name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a run that may already have uploaded to PyPI — a re-tagged
# correction must queue behind its predecessor, not race it. Grouping per
# workflow+ref also keeps a mistaken-then-corrected tag pair from stacking up
# four indistinguishable approval prompts across the two release workflows.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Gate the irreversible publish on the TAGGED commit (2026-07-25). Two gaps
    # made a bad tag ship silently: ci.yml has no tag trigger, so nothing tested
    # what was actually tagged; and `skip-existing: true` below — added after the
    # v0.12.1 wrapper incident — turns a tag/version mismatch from a loud PyPI
    # "400 File already exists" into a green no-op that publishes nothing while
    # the Release page announces a new version. Both are fail-fast here instead.
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Tag name must match the tagged tree's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # v0.13.0 -> 0.13.0; a wrapper-republish tag v0.12.1-wrapper.1 -> 0.12.1
          expected="${TAG#v}"; expected="${expected%%-*}"
          actual="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $TAG expects version $expected but the tagged tree has $actual — the version bump is probably uncommitted"
            exit 1
          fi
          echo "tag $TAG matches pyproject $actual"

      # Moved here from publish-wrapper.yml when the two publishes merged
      # (PMSERV-174). Both version assertions must fail BEFORE the single
      # approval prompt: once that prompt is approved, pmlens uploads and the
      # window for "stop, the wrapper is stale" has closed permanently.
      - name: Tag name must match the wrapper's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"; expected="${expected%%-*}"
          actual="$(python -c 'import tomllib;print(tomllib.load(open("packaging/pm-server-wrapper/pyproject.toml","rb"))["project"]["version"])')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $TAG expects wrapper version $expected but the tagged tree has $actual"
            exit 1
          fi
          echo "tag $TAG matches wrapper $actual"

      - name: Install lockfile checker
        run: pip install uv==0.11.25

      - name: Check both lockfiles on the tagged commit
        # CI does not run on tags. Recheck here before build/publish/approval.
        run: python scripts/lockfiles.py check

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/lockfiles.py

      - name: Format check with ruff
        run: ruff format --check src/ tests/ scripts/lockfiles.py

      - name: Run tests
        run: pytest -q

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distributions
        run: |
          ls -la dist/
          test -n "$(ls dist/*.whl 2>/dev/null)"
          test -n "$(ls dist/*.tar.gz 2>/dev/null)"
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  build-wrapper:
    # The pm-server compat wrapper, built here since PMSERV-174 merged the two
    # publishes into one approval. Building is unprivileged and gate-free, so it
    # runs beside `build`; only the upload is gated.
    name: Build wrapper distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build wrapper sdist + wheel
        run: python -m build packaging/pm-server-wrapper --outdir wrapper-dist

      - name: Validate distributions
        run: |
          ls -la wrapper-dist/
          test -n "$(ls wrapper-dist/*.whl 2>/dev/null)"
          test -n "$(ls wrapper-dist/*.tar.gz 2>/dev/null)"
          twine check wrapper-dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wrapper-dist
          path: wrapper-dist/
          if-no-files-found: error

  publish:
    # ONE approval publishes both distributions, in order (PMSERV-174, ADR-050
    # Phase 3). Until here a v* tag fired two workflows with two independent
    # `pypi` gates, and approving only one shipped a half-release: PMSERV-173
    # made both orderings loud, but the ordering itself stayed a human's job.
    #
    # Why one JOB rather than two jobs chained with `needs:` — which is what
    # docs/RELEASING.md §6 originally proposed: GitHub creates a pending
    # deployment per JOB, so two jobs on the `pypi` environment means two
    # approval prompts, and a `needs:` chain makes them sequential rather than
    # batchable. That is the two-approval problem again under a new name. With
    # both uploads as steps in one job the prompt appears once, and ordering
    # stops being a policy: if the pmlens upload fails, the wrapper step is
    # never reached. That is a stronger guarantee than `needs:` gave, since
    # `needs:` only requires the prior job to *succeed* — and `skip-existing`
    # means success is not evidence anything was uploaded.
    name: Publish pmlens + pm-server wrapper to PyPI (single approval)
    needs: [build, build-wrapper]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pmlens/
    permissions:
      id-token: write       # OIDC required for PyPI Trusted Publisher
      attestations: write   # PEP 740 provenance attestation
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download wrapper distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wrapper-dist
          path: wrapper-dist/

      # pmlens FIRST — always. The wrapper is a metapackage declaring
      # `pmlens>=X.Y.Z`; published before pmlens X.Y.Z exists it leaves
      # `uvx pm-server@X.Y.Z` unresolvable, and PyPI never allows re-uploading
      # a filename, so that window would be permanent rather than recoverable.
      # Step order is the whole enforcement mechanism here: keep these two
      # steps adjacent and in this order.
      - name: Publish pmlens to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Idempotent republish: a re-fired tag run must not fail on files
          # already uploaded (e.g. re-tagging to republish the pm-server
          # wrapper after its version-lockstep miss at v0.12.1).
          skip-existing: true

      - name: Publish pm-server wrapper to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: wrapper-dist/
          skip-existing: true

  pack-mcpb:
    name: Pack Claude Desktop/Cowork .mcpb bundle (PMSERV-083)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate manifest and build bundle
        run: python scripts/build_mcpb.py

      - name: Upload .mcpb bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mcpb-bundle
          path: dist/pmlens-*.mcpb
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    # Release-page automation (2026-07-20): v0.11.0–v0.12.1 shipped to PyPI
    # with no Release page entry, leaving "Latest v0.10.0" stale for weeks.
    # Runs only after the PyPI publish succeeded, and only for plain vX.Y.Z
    # tags — wrapper-republish tags (e.g. v0.12.1-wrapper.1) also match the
    # v* trigger but must not get a Release entry.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [publish, pack-mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The Release page is the announcement. Do not announce a version whose
      # committed plugin pin cannot resolve.
      #
      # Since PMSERV-174 the wrapper is published by the same job as pmlens, so
      # the "maintainer approved only one workflow" hole this originally closed
      # is gone. The poll STAYS anyway, because it checks a different thing:
      # `skip-existing: true` means a green publish step is not evidence that
      # anything was uploaded. This asks PyPI directly, which is the only
      # observation that actually distinguishes "released" from "no-op'd".
      # Removing it would restore the v0.11.0–v0.12.1 failure mode (a `--latest`
      # Release announcing a version whose `uvx pm-server@X.Y.Z` in
      # plugin/.mcp.json is unresolvable) with no job red anywhere.
      - name: Require the pm-server wrapper on PyPI before announcing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"; version="${version%%-*}"
          if [ -z "$version" ]; then
            echo "::error::could not derive a version from tag '$TAG'"
            exit 1
          fi
          url="https://pypi.org/pypi/pm-server/${version}/json"
          # 10 polls over ~11 min of backoff (15s, 30s … 135s between them; no
          # sleep after the last, which would be 2.5 min of not looking). Each
          # poll is bounded by --retry-max-time so a hung endpoint cannot stretch
          # the step: --max-time caps ONE attempt, not the retried transfer.
          # PyPI propagation is normally well under a minute; the budget exists
          # for a human approving the second run late, not for the CDN.
          attempts=10
          for attempt in $(seq 1 "$attempts"); do
            # curl prints 000 to stdout on a transport failure AND exits non-zero,
            # so the fallback must ASSIGN rather than append another 000.
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      --max-time 20 --retry 2 --retry-max-time 40 --retry-connrefused \
                      -H 'Accept: application/json' "$url")" || code=000
            if [ "$code" = "200" ]; then
              echo "pm-server ${version} is on PyPI (poll ${attempt})"
              exit 0
            fi
            echo "poll ${attempt}/${attempts}: HTTP ${code} for ${url}"
            [ "$attempt" -lt "$attempts" ] && sleep $((attempt * 15))
          done
          echo "::error::pm-server ${version} is not on PyPI after 10 polls (~11 minutes). The wrapper run ('Release wrapper (pm-server) to PyPI') is probably still awaiting its own environment approval — approve it, then re-run this job. See docs/RELEASING.md."
          exit 1

      - name: Download .mcpb bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: mcpb-bundle
          path: mcpb/

      - name: Create Release from the annotated tag (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # %(contents:*) is only meaningful for an ANNOTATED tag. On a
          # lightweight tag it resolves to the COMMIT message, which would
          # publish the commit subject and its trailers (Co-Authored-By etc.)
          # as the public release notes. Detect the object type instead of
          # trusting the format string.
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            title="$(git tag -l --format='%(contents:subject)' "$TAG")"
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
          else
            echo "::warning::$TAG is a lightweight tag — falling back to the CHANGELOG pointer instead of the commit message"
            title=""
            : > notes.md
          fi
          test -s notes.md || echo "See CHANGELOG.md for details." > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
          else
            gh release create "$TAG" mcpb/pmlens-*.mcpb --verify-tag --latest \
              --title "${title:-$TAG}" --notes-file notes.md
          fi
